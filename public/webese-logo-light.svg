<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <!-- Primary gradient for light mode -->
    <linearGradient id="primaryGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Icon gradient -->
    <linearGradient id="iconGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="40%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Sparkle gradient -->
    <linearGradient id="sparkleGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <!-- Icon: Friendly AI Robot Face -->
  <g transform="translate(4, 4)">
    <!-- Background rounded square -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#iconGradientLight)"/>

    <!-- Inner highlight -->
    <rect x="3" y="3" width="42" height="42" rx="9" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- Robot face -->
    <g transform="translate(24, 24)">
      <!-- Eyes -->
      <ellipse cx="-9" cy="-4" rx="4.5" ry="5" fill="white"/>
      <ellipse cx="9" cy="-4" rx="4.5" ry="5" fill="white"/>

      <!-- Pupils -->
      <circle cx="-7.5" cy="-3" r="2.2" fill="#1e1b4b"/>
      <circle cx="10.5" cy="-3" r="2.2" fill="#1e1b4b"/>

      <!-- Eye shine -->
      <circle cx="-9" cy="-5" r="1.2" fill="rgba(255,255,255,0.8)"/>
      <circle cx="7.5" cy="-5" r="1.2" fill="rgba(255,255,255,0.8)"/>

      <!-- Smile -->
      <path d="M-10 6 Q0 15 10 6" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>

      <!-- Antenna -->
      <line x1="0" y1="-18" x2="0" y2="-13" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="-20" r="3" fill="url(#sparkleGradientLight)"/>
      <circle cx="0" cy="-20" r="1.5" fill="white"/>
    </g>
  </g>

  <!-- Wordmark - darker for light backgrounds -->
  <text
    x="64"
    y="32"
    font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="32"
    font-weight="700"
    fill="url(#primaryGradientLight)"
    dominant-baseline="middle"
    letter-spacing="-0.02em"
  >
    Webese
  </text>
</svg>