<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer rounded rectangle -->
  <rect x="10" y="10" width="180" height="180" rx="32" ry="32" fill="#FAD8F0" stroke="#7C35B8" stroke-width="12"/>
  <!-- Title bar top (round top corners only) -->
  <rect x="10" y="10" width="180" height="52" rx="32" ry="32" fill="#FAD8F0" stroke="#7C35B8" stroke-width="12"/>
  <!-- Fill flat bottom of title bar -->
  <rect x="16" y="44" width="168" height="18" fill="#FAD8F0"/>
  <!-- Title bar divider line -->
  <line x1="10" y1="62" x2="190" y2="62" stroke="#7C35B8" stroke-width="12"/>
  <!-- Three dots (left side) -->
  <circle cx="46" cy="36" r="7" fill="#7C35B8"/>
  <circle cx="70" cy="36" r="7" fill="#7C35B8"/>
  <circle cx="94" cy="36" r="7" fill="#7C35B8"/>
  <!-- Smooth growth curve -->
  <path d="M 38,158 C 60,158 75,130 105,110 S 140,85 158,68"
    stroke="#7C35B8" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- Arrow head (↗) -->
  <polyline points="136,62 162,62 162,88"
    stroke="#7C35B8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
