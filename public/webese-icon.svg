<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Primary icon gradient -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Antenna sparkle gradient -->
    <linearGradient id="sparkleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#iconGradient)"/>

  <!-- Subtle inner border -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Robot face -->
  <g transform="translate(32, 34)">
    <!-- Friendly eyes -->
    <ellipse cx="-12" cy="-6" rx="6" ry="7" fill="white"/>
    <ellipse cx="12" cy="-6" rx="6" ry="7" fill="white"/>

    <!-- Eye pupils -->
    <circle cx="-10" cy="-5" r="3" fill="#1e1b4b"/>
    <circle cx="14" cy="-5" r="3" fill="#1e1b4b"/>

    <!-- Eye highlights -->
    <circle cx="-12" cy="-7" r="1.5" fill="rgba(255,255,255,0.85)"/>
    <circle cx="10" cy="-7" r="1.5" fill="rgba(255,255,255,0.85)"/>

    <!-- Friendly curved smile -->
    <path d="M-14 8 Q0 20 14 8" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Antenna -->
    <line x1="0" y1="-24" x2="0" y2="-18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-26" r="4" fill="url(#sparkleGradient)"/>
    <circle cx="0" cy="-26" r="2" fill="white"/>
  </g>
</svg>